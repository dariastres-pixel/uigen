<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAP Music Player</title>

<style>
@font-face { font-family:"72"; src:url("sap-fonts/72-Regular-full.woff") format("woff"); font-weight:400; font-display:swap; }
@font-face { font-family:"72"; src:url("sap-fonts/72-Semibold-full.woff") format("woff"); font-weight:600; font-display:swap; }
@font-face { font-family:"72"; src:url("sap-fonts/72-SemiboldDuplex.woff") format("woff"); font-weight:700; font-display:swap; }
@font-face { font-family:"72"; src:url("sap-fonts/72-Bold-full.woff") format("woff"); font-weight:800; font-display:swap; }
@font-face { font-family:"72"; src:url("sap-fonts/72-Light-full.woff") format("woff"); font-weight:300; font-display:swap; }
@font-face { font-family:"72 Brand"; src:url("sap-fonts/72-Regular-full.woff") format("woff"); font-weight:400; font-display:swap; }
@font-face { font-family:"72 Brand"; src:url("sap-fonts/72-Semibold-full.woff") format("woff"); font-weight:500; font-display:swap; }
@font-face { font-family:"72 Brand"; src:url("sap-fonts/72-SemiboldDuplex.woff") format("woff"); font-weight:700; font-display:swap; }
@font-face { font-family:"72 Mono"; src:url("sap-fonts/72Mono-Bold-full.woff") format("woff"); font-weight:400 700; font-display:swap; }

*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;}

:root{
  --sap-brand:#0070F2;
  --sap-active:#0064D9;
  --sap-link:#0064D9;
  --sap-link-deep:#003D86;
  --sap-text:#131E29;
  --sap-text-strong:#1A2733;
  --sap-label:#556B82;
  --sap-muted:#758CA4;
  --sap-bg:#F5F6F7;
  --sap-white:#fff;
  --sap-border:#D9D9D9;
  --sap-border-light:#E5E5E5;
  --sap-selected:#D1EFFF;
  --sap-hover:#EAECEE;
  --sap-negative:#AA0808;
  --sap-info-bg:#D1EFFF;
  --sap-success-bg:#EBF5CB;
  --sap-positive:#256F3A;
  --sap-shadow0:0 2px 4px rgba(34,53,72,.2),0 0 2px rgba(34,53,72,.2);
  --sap-shadow2:0 4px 12px rgba(34,53,72,.2),0 0 4px rgba(34,53,72,.15);
  --ff:"72","Inter",-apple-system,sans-serif;
  --ff-brand:"72 Brand","72","Inter",sans-serif;
  --ff-mono:"72 Mono","IBM Plex Mono",monospace;
}

body{font-family:var(--ff);font-size:14px;color:var(--sap-text);background:var(--sap-bg);-webkit-font-smoothing:antialiased;}

/* app shell */
.app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;}
.body{flex:1;display:flex;overflow:hidden;}

/* shell bar */
.shell{height:52px;background:var(--sap-white);border-bottom:1px solid var(--sap-border);display:flex;align-items:center;padding:0 16px;gap:8px;flex:none;z-index:10;}
.shell-btn{width:36px;height:36px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sap-text-strong);position:relative;}
.shell-btn:hover{background:var(--sap-hover);}
.shell-btn__badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--sap-negative);color:#fff;font-size:10px;font-weight:700;border-radius:999px;border:1px solid #fff;display:inline-flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
.shell__branding{display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 4px;border-radius:8px;cursor:pointer;text-decoration:none;color:inherit;}
.shell__branding:hover{background:var(--sap-hover);}
.shell__branding img{height:22px;width:auto;display:block;}
.shell__branding-text{font-family:var(--ff-brand);font-weight:500;font-size:14px;color:var(--sap-text);}
.shell__sep{width:1px;height:24px;background:var(--sap-border);margin:0 4px;}
.shell__module{font-family:var(--ff-brand);font-weight:500;font-size:14px;color:var(--sap-label);}
.shell__search{flex:1;max-width:460px;margin:0 16px;position:relative;}
.shell__search input{width:100%;height:36px;padding:0 12px 0 36px;border:1px solid #BCC3CA;border-radius:8px;font:400 14px var(--ff);color:var(--sap-text);background:#fff;outline:none;}
.shell__search input::placeholder{color:var(--sap-muted);}
.shell__search input:focus{border-color:var(--sap-brand);box-shadow:0 0 0 1px var(--sap-brand);}
.shell__search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sap-muted);pointer-events:none;display:flex;}
.shell__spacer{flex:1;}
.shell__actions{display:flex;align-items:center;gap:4px;}
.shell__avatar{width:32px;height:32px;border-radius:50%;background:#C0E5FF;color:#003D86;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;cursor:pointer;margin-left:4px;border:none;}

/* side nav */
.sidenav{width:260px;background:var(--sap-white);border-right:1px solid var(--sap-border);flex:none;display:flex;flex-direction:column;padding:12px 0;overflow-y:auto;}
.sidenav__label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--sap-muted);padding:12px 20px 6px;}
.sidenav__divider{height:1px;background:var(--sap-border);margin:12px 16px;}
.nav-item{display:flex;align-items:center;gap:12px;height:36px;margin:2px 8px;padding:0 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--sap-text);text-decoration:none;position:relative;white-space:nowrap;overflow:hidden;user-select:none;}
.nav-item:hover{background:var(--sap-hover);}
.nav-item.active{background:var(--sap-selected);color:var(--sap-link);font-weight:700;}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:4px;bottom:4px;width:3px;background:var(--sap-brand);border-radius:0 2px 2px 0;}
.nav-item__count{margin-left:auto;font-size:12px;color:var(--sap-label);font-weight:400;}
.nav-item.active .nav-item__count{color:var(--sap-link);}
.playlist-dot{width:20px;height:20px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.nav-label{overflow:hidden;text-overflow:ellipsis;}

/* icon mask */
.icon{display:inline-block;flex:none;background-color:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}

/* main */
.main{flex:1;overflow-y:auto;background:var(--sap-bg);display:flex;flex-direction:column;}
.page-header{background:var(--sap-white);border-bottom:1px solid var(--sap-border);padding:18px 32px 14px;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sap-label);margin-bottom:8px;}
.breadcrumb a{color:var(--sap-link);text-decoration:none;}
.breadcrumb a:hover{text-decoration:underline;}
.page-title{font-family:var(--ff-brand);font-weight:500;font-size:28px;line-height:1;color:var(--sap-text);margin:0 0 8px;}
.page-sub{font-size:13px;color:var(--sap-label);}
.content{padding:20px 32px 24px;display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start;}

/* now playing */
.np{background:var(--sap-white);border:1px solid var(--sap-border);border-radius:16px;box-shadow:var(--sap-shadow0);overflow:hidden;}
.np__hdr{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sap-border);gap:8px;}
.np__hdr-title{font-family:var(--ff-brand);font-weight:500;font-size:16px;color:var(--sap-text);}
.np__hdr-spacer{flex:1;}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font:700 12px/16px var(--ff);}
.tag--info{background:var(--sap-info-bg);color:var(--sap-brand);}
.np__body{display:grid;grid-template-columns:320px 1fr;gap:28px;padding:28px 28px 24px;}
.album-art{width:320px;height:320px;border-radius:12px;box-shadow:var(--sap-shadow2);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;flex:none;}
.album-art__noise{position:absolute;inset:0;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.18),transparent 55%),radial-gradient(circle at 78% 82%,rgba(0,0,0,.18),transparent 60%);}
.album-art__label{position:relative;font-family:var(--ff-brand);font-weight:700;font-size:42px;color:#fff;text-align:center;padding:0 20px;letter-spacing:-.01em;text-shadow:0 1px 12px rgba(0,0,0,.18);}
.np__info{display:flex;flex-direction:column;gap:16px;min-width:0;padding-top:6px;}
.np__eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sap-muted);}
.np__track-title{font-family:var(--ff-brand);font-weight:500;font-size:36px;line-height:1.05;letter-spacing:-.01em;color:var(--sap-text-strong);}
.np__artist{font-size:16px;color:var(--sap-text);}
.np__artist a{color:var(--sap-link);text-decoration:none;font-weight:700;}
.np__artist a:hover{text-decoration:underline;}
.np__album{font-size:13px;color:var(--sap-label);}
.np__meta{display:flex;gap:24px;padding:12px 0;border-top:1px solid var(--sap-border-light);border-bottom:1px solid var(--sap-border-light);}
.np__meta-item{display:flex;flex-direction:column;gap:2px;}
.np__meta-label{font-size:11px;color:var(--sap-label);}
.np__meta-value{font-family:var(--ff-brand);font-weight:500;font-size:15px;color:var(--sap-text);}
.np__actions{display:flex;align-items:center;gap:8px;margin-top:auto;}

/* queue */
.queue{background:var(--sap-white);border:1px solid var(--sap-border);border-radius:16px;box-shadow:var(--sap-shadow0);overflow:hidden;max-height:calc(100vh - 52px - 90px - 110px - 44px);display:flex;flex-direction:column;}
.queue__hdr{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sap-border);gap:8px;flex:none;}
.queue__title{font-family:var(--ff-brand);font-weight:500;font-size:16px;color:var(--sap-text);}
.queue__count{color:var(--sap-label);font-size:14px;margin-left:4px;}
.queue__spacer{flex:1;}
.queue__list{overflow-y:auto;flex:1;}
.q-row{display:grid;grid-template-columns:28px 36px 1fr auto auto;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--sap-border-light);cursor:pointer;}
.q-row:last-child{border-bottom:0;}
.q-row:hover{background:var(--sap-hover);}
.q-row.playing{background:var(--sap-selected);}
.q-row__idx{font-family:var(--ff-mono);font-size:13px;color:var(--sap-label);text-align:center;}
.q-row.playing .q-row__idx{color:var(--sap-brand);}
.q-row__info{min-width:0;display:flex;flex-direction:column;gap:2px;}
.q-row__title{font-size:14px;font-weight:700;color:var(--sap-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.q-row.playing .q-row__title{color:var(--sap-link);}
.q-row__artist{font-size:12px;color:var(--sap-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.q-row__dur{font-family:var(--ff-mono);font-size:13px;color:var(--sap-label);}
.q-row__menu{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--sap-label);background:transparent;border:0;cursor:pointer;opacity:0;}
.q-row:hover .q-row__menu,.q-row.playing .q-row__menu{opacity:1;}
.q-row__menu:hover{background:rgba(0,0,0,.06);}
.mini-art{border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--ff-brand);flex-shrink:0;}

/* equalizer */
.eq{display:inline-flex;align-items:flex-end;justify-content:center;gap:2px;width:14px;height:14px;}
.eq span{display:block;width:2px;background:var(--sap-brand);border-radius:1px;animation:eq 900ms ease-in-out infinite;}
.eq span:nth-child(1){animation-delay:0ms;}
.eq span:nth-child(2){animation-delay:150ms;}
.eq span:nth-child(3){animation-delay:300ms;}
.eq span:nth-child(4){animation-delay:100ms;}
@keyframes eq{0%,100%{height:30%;}50%{height:100%;}}

/* player bar */
.player{height:90px;background:var(--sap-white);border-top:1px solid var(--sap-border);flex:none;display:grid;grid-template-columns:320px 1fr 320px;align-items:center;padding:0 24px;gap:24px;box-shadow:0 -2px 8px rgba(34,53,72,.05);z-index:5;}
.player__left{display:flex;align-items:center;gap:12px;min-width:0;}
.player__left-info{min-width:0;display:flex;flex-direction:column;gap:2px;}
.player__track{font-size:14px;font-weight:700;color:var(--sap-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player__artist{font-size:12px;color:var(--sap-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player__like{width:32px;height:32px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--sap-label);display:inline-flex;align-items:center;justify-content:center;flex:none;}
.player__like:hover{background:var(--sap-hover);color:var(--sap-text);}
.player__like.liked{color:var(--sap-brand);}
.player__center{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;}
.player__controls{display:flex;align-items:center;gap:12px;}
.ctrl-btn{width:36px;height:36px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--sap-label);display:inline-flex;align-items:center;justify-content:center;position:relative;}
.ctrl-btn:hover{background:var(--sap-hover);color:var(--sap-text-strong);}
.ctrl-btn.active{color:var(--sap-brand);}
.ctrl-btn.active::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:currentColor;}
.play-btn{width:44px;height:44px;border-radius:999px;border:0;background:var(--sap-brand);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background 150ms;}
.play-btn:hover{background:var(--sap-active);}
.play-btn:active{background:#003D86;}
.player__progress{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;}
.player__time{font-family:var(--ff-mono);font-size:12px;color:var(--sap-label);min-width:40px;text-align:center;}
.player__right{display:flex;align-items:center;justify-content:flex-end;gap:6px;}
.player__vol{width:110px;display:flex;align-items:center;gap:6px;color:var(--sap-label);}

/* slider */
.slider{flex:1;height:16px;position:relative;cursor:pointer;display:flex;align-items:center;}
.slider__track{flex:1;height:4px;background:var(--sap-border-light);border-radius:999px;overflow:hidden;position:relative;}
.slider__fill{position:absolute;inset:0 auto 0 0;background:var(--sap-brand);border-radius:999px;}
.slider__thumb{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--sap-brand);top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity 120ms;pointer-events:none;}
.slider:hover .slider__thumb{opacity:1;}
.slider:hover .slider__fill{background:var(--sap-active);}

/* buttons */
.btn{height:36px;padding:0 16px;border-radius:8px;font-family:var(--ff);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background 150ms,border-color 150ms;}
.btn--secondary{background:#fff;color:var(--sap-link);border-color:#BCC3CA;}
.btn--secondary:hover{background:var(--sap-hover);border-color:#758CA4;}
.btn--tertiary{background:transparent;color:var(--sap-link);}
.btn--tertiary:hover{background:var(--sap-hover);}
.btn--icon{width:36px;padding:0;}
</style>
</head>

  Heart: ({s=18,f})=><svg width={s} height={s} viewBox="0 0 24 24" fill={f?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
  Cast:  ({s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 16v2a2 2 0 0 0 2 2h2"/><path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-8"/><line x1="2" y1="20" x2="2.01" y2="20"/><path d="M2 12a8 8 0 0 1 8 8"/><path d="M2 16a4 4 0 0 1 4 4"/></svg>,
  More:  ({s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>,
  Add:   ({s=14})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
};

function SapIcon({ name, size=16 }) {
  return <span className="icon" style={{width:size,height:size,WebkitMaskImage:`url(sap-icons/${name}.svg)`,maskImage:`url(sap-icons/${name}.svg)`}}/>;
}

/* ── Slider ── */
function Slider({ value, max, onChange, label }) {
  const ref = useRef(null);
  const [drag, setDrag] = useState(false);
  const pct = max ? Math.min(100, Math.max(0, value/max*100)) : 0;
  const calc = useCallback((e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    onChange(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * max);
  }, [max, onChange]);
  useEffect(() => {
    if (!drag) return;
    const up = () => setDrag(false);
    window.addEventListener("mousemove", calc);
    window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mousemove", calc); window.removeEventListener("mouseup", up); };
  }, [drag, calc]);
  return (
    <div className="slider" ref={ref} role="slider" aria-label={label} aria-valuenow={Math.round(value)} aria-valuemax={Math.round(max)}
      onMouseDown={e=>{ setDrag(true); calc(e); }}>
      <div className="slider__track"><div className="slider__fill" style={{width:`${pct}%`}}/></div>
      <div className="slider__thumb" style={{left:`${pct}%`}}/>
    </div>
  );
}

/* ── Shell Bar ── */
function Shell() {
  return (
    <header className="shell">
      <button className="shell-btn" aria-label="Menu"><SapIcon name="menu" size={18}/></button>
      <a className="shell__branding" href="#">
        <img src="sap-logo.svg" alt="SAP"/>
        <span className="shell__branding-text">Music Player</span>
      </a>
      <div className="shell__sep"/>
      <span className="shell__module">My Library</span>
      <div className="shell__search">
        <span className="shell__search-icon"><SapIcon name="search" size={14}/></span>
        <input placeholder="Search songs, artists, albums…"/>
      </div>
      <div className="shell__spacer"/>
      <div className="shell__actions">
        <button className="shell-btn" aria-label="Notifications">
          <SapIcon name="bell" size={18}/>
          <span className="shell-btn__badge">2</span>
        </button>
        <button className="shell-btn" aria-label="Help"><SapIcon name="hint" size={18}/></button>
        <button className="shell-btn" aria-label="Settings"><SapIcon name="settings" size={18}/></button>
        <button className="shell__avatar" aria-label="Account">AK</button>
      </div>
    </header>
  );
}

/* ── Side Nav ── */
function SideNav({ active, onSelect }) {
  function Item({ id, icon, label, count }) {
    return (
      <a className={`nav-item${active===id?" active":""}`} href="#"
        onClick={e=>{ e.preventDefault(); onSelect(id); }}>
        <SapIcon name={icon} size={18}/>
        <span className="nav-label">{label}</span>
        {count!=null && <span className="nav-item__count">{count}</span>}
      </a>
    );
  }
  return (
    <nav className="sidenav">
      <Item id="home"    icon="home"     label="Home"/>
      <Item id="browse"  icon="list"     label="Browse"/>
      <Item id="inbox"   icon="inbox"    label="New Releases"/>
      <div className="sidenav__divider"/>
      <div className="sidenav__label">Library</div>
      <Item id="liked"   icon="favorite" label="Liked Songs"       count={312}/>
      <Item id="saved"   icon="bookmark" label="Saved Albums"      count={47}/>
      <Item id="artists" icon="group"    label="Followed Artists"  count={28}/>
      <div className="sidenav__divider"/>
      <div className="sidenav__label">Playlists</div>
      {PLAYLISTS.map(p=>(
        <a key={p.id} className={`nav-item${active===p.id?" active":""}`} href="#"
          onClick={e=>{ e.preventDefault(); onSelect(p.id); }}>
          <span className="playlist-dot" style={{background:p.color}}>{p.name[0]}</span>
          <span className="nav-label">{p.name}</span>
          <span className="nav-item__count">{p.count}</span>
        </a>
      ))}
    </nav>
  );
}

/* ── Album Art ── */
function AlbumArt({ track }) {
  return (
    <div className="album-art" style={{background:track.gradient}}>
      <div className="album-art__noise"/>
      <div className="album-art__label">{track.initials}</div>
    </div>
  );
}
function MiniArt({ track, size=36 }) {
  return (
    <div className="mini-art" style={{width:size,height:size,background:track.gradient,fontSize:size*.32}}>
      {track.initials}
    </div>
  );
}

/* ── Now Playing ── */
function NowPlaying({ track, liked, onToggleLike }) {
  return (
    <section className="np">
      <div className="np__hdr">
        <div className="np__hdr-title">Now Playing</div>
        <span className="tag tag--info">Listening</span>
        <div className="np__hdr-spacer"/>
        <button className="btn btn--tertiary btn--icon" aria-label="More"><Ic.More s={16}/></button>
      </div>
      <div className="np__body">
        <AlbumArt track={track}/>
        <div className="np__info">
          <div className="np__eyebrow">Track · From {track.album}</div>
          <h2 className="np__track-title">{track.title}</h2>
          <div className="np__artist">by <a href="#">{track.artist}</a></div>
          <div className="np__album">{track.album} · {track.year}</div>
          <div className="np__meta">
            <div className="np__meta-item"><span className="np__meta-label">Duration</span><span className="np__meta-value">{fmt(track.durationSec)}</span></div>
            <div className="np__meta-item"><span className="np__meta-label">Quality</span><span className="np__meta-value">Lossless · 24-bit</span></div>
            <div className="np__meta-item"><span className="np__meta-label">Source</span><span className="np__meta-value">Stream</span></div>
          </div>
          <div className="np__actions">
            <button className="btn btn--secondary" onClick={onToggleLike}><Ic.Heart s={16} f={liked}/>{liked?"Liked":"Like"}</button>
            <button className="btn btn--tertiary"><Ic.Add s={14}/>Add to Playlist</button>
            <button className="btn btn--tertiary"><Ic.Cast s={14}/>Devices</button>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── Queue ── */
function Queue({ tracks, currentId, onPlay, isPlaying }) {
  return (
    <section className="queue">
      <div className="queue__hdr">
        <span className="queue__title">Up Next</span>
        <span className="queue__count">({tracks.length})</span>
        <div className="queue__spacer"/>
        <button className="btn btn--tertiary btn--icon" aria-label="Shuffle"><Ic.Shuffle s={14}/></button>
        <button className="btn btn--tertiary btn--icon" aria-label="More"><Ic.More s={16}/></button>
      </div>
      <div className="queue__list">
        {tracks.map((t,i)=>{
          const playing = t.id===currentId;
          return (
            <div key={t.id} className={`q-row${playing?" playing":""}`} onClick={()=>onPlay(t.id)}>
              <div className="q-row__idx">
                {playing && isPlaying
                  ? <span className="eq"><span/><span/><span/><span/></span>
                  : (i+1).toString().padStart(2,"0")}
              </div>
              <MiniArt track={t}/>
              <div className="q-row__info">
                <div className="q-row__title">{t.title}</div>
                <div className="q-row__artist">{t.artist} · {t.album}</div>
              </div>
              <div className="q-row__dur">{fmt(t.durationSec)}</div>
              <button className="q-row__menu" aria-label="Options" onClick={e=>e.stopPropagation()}><Ic.More s={14}/></button>
            </div>
          );
        })}
      </div>
    </section>
  );
}

/* ── Player Bar ── */
function PlayerBar({ track, isPlaying, onTogglePlay, onPrev, onNext, position, onSeek,
                     shuffle, onShuffle, repeat, onRepeat, volume, onVolume, liked, onToggleLike }) {
  return (
    <footer className="player">
      <div className="player__left">
        <MiniArt track={track} size={56}/>
        <div className="player__left-info">
          <div className="player__track">{track.title}</div>
          <div className="player__artist">{track.artist}</div>
        </div>
        <button className={`player__like${liked?" liked":""}`} onClick={onToggleLike} aria-label="Like">
          <Ic.Heart s={18} f={liked}/>
        </button>
      </div>

      <div className="player__center">
        <div className="player__controls">
          <button className={`ctrl-btn${shuffle?" active":""}`} onClick={onShuffle} aria-label="Shuffle"><Ic.Shuffle s={16}/></button>
          <button className="ctrl-btn" onClick={onPrev} aria-label="Previous"><Ic.Prev s={18}/></button>
          <button className="play-btn" onClick={onTogglePlay} aria-label={isPlaying?"Pause":"Play"}>
            {isPlaying ? <Ic.Pause s={20}/> : <Ic.Play s={20}/>}
          </button>
          <button className="ctrl-btn" onClick={onNext} aria-label="Next"><Ic.Next s={18}/></button>
          <button className={`ctrl-btn${repeat?" active":""}`} onClick={onRepeat} aria-label="Repeat"><Ic.Repeat s={16}/></button>
        </div>
        <div className="player__progress">
          <span className="player__time">{fmt(position)}</span>
          <Slider value={position} max={track.durationSec} onChange={onSeek} label="Seek"/>
          <span className="player__time">{fmt(track.durationSec)}</span>
        </div>
      </div>

      <div className="player__right">
        <button className="ctrl-btn" aria-label="Queue"><Ic.Queue s={16}/></button>
        <button className="ctrl-btn" aria-label="Cast"><Ic.Cast s={16}/></button>
        <div className="player__vol">
          <Ic.Volume s={16}/>
          <Slider value={volume} max={100} onChange={onVolume} label="Volume"/>
        </div>
      </div>
    </footer>
  );
}

/* ── App ── */
function App() {
  const [idx, setIdx]       = useState(0);
  const [playing, setPlay]  = useState(true);
  const [pos, setPos]       = useState(96);
  const [shuffle, setShuffle] = useState(false);
  const [repeat, setRepeat]   = useState(false);
  const [volume, setVolume]   = useState(72);
  const [liked, setLiked]     = useState({1:true,3:true});
  const [nav, setNav]         = useState("liked");

  const track = TRACKS[idx];

  useEffect(()=>{
    if (!playing) return;
    const t = setInterval(()=>{
      setPos(p=>{
        if (p+1>=track.durationSec) { setIdx(i=>(i+1)%TRACKS.length); return 0; }
        return p+1;
      });
    }, 1000);
    return ()=>clearInterval(t);
  }, [playing, track.durationSec]);

  function playId(id) {
    const i = TRACKS.findIndex(t=>t.id===id);
    if (i>=0) { setIdx(i); setPos(0); setPlay(true); }
  }
  function prev() { if (pos>3) { setPos(0); return; } setIdx(i=>(i-1+TRACKS.length)%TRACKS.length); setPos(0); }
  function next() { setIdx(i=>(i+1)%TRACKS.length); setPos(0); }
  function toggleLike() { setLiked(m=>({...m,[track.id]:!m[track.id]})); }

  return (
    <div className="app">
      <Shell/>
      <div className="body">
        <SideNav active={nav} onSelect={setNav}/>
        <main className="main">
          <div className="page-header">
            <div className="breadcrumb"><a href="#">Library</a><span>›</span><a href="#">Liked Songs</a><span>›</span><span>Now Playing</span></div>
            <h1 className="page-title">Liked Songs</h1>
            <div className="page-sub">{TRACKS.length} tracks · 53 min · Last updated May 8, 2026</div>
          </div>
          <div className="content">
            <NowPlaying track={track} liked={!!liked[track.id]} onToggleLike={toggleLike}/>
            <Queue tracks={TRACKS} currentId={track.id} onPlay={playId} isPlaying={playing}/>
          </div>
        </main>
      </div>
      <PlayerBar
        track={track} isPlaying={playing}
        onTogglePlay={()=>setPlay(p=>!p)} onPrev={prev} onNext={next}
        position={pos} onSeek={setPos}
        shuffle={shuffle} onShuffle={()=>setShuffle(v=>!v)}
        repeat={repeat}  onRepeat={()=>setRepeat(v=>!v)}
        volume={volume}  onVolume={setVolume}
        liked={!!liked[track.id]} onToggleLike={toggleLike}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
